<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Camera setup for form videos and progress photos</title>
  <desc id="d">Side view: phone on a tripod at hip height, 3 to 4 metres from the lifter, who stands side-on with head and feet inside the frame. Top view: the camera looks at the lifter's side; progress photos are taken 2 to 2.5 metres away at chest height, front, side and back.</desc>
  <rect width="960" height="430" rx="16" fill="#f7f8fa"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6475"/></marker>
  </defs>

  <!-- side view -->
  <text x="30" y="40" font-size="17" font-weight="700" fill="#1a1d24">Form videos: side view</text>
  <line x1="30" y1="350" x2="560" y2="350" stroke="#9aa1ad" stroke-width="2"/>
  <!-- tripod + phone -->
  <g stroke="#1a1d24" stroke-width="3" stroke-linecap="round">
    <line x1="90" y1="350" x2="105" y2="262"/><line x1="120" y1="350" x2="105" y2="262"/><line x1="105" y1="262" x2="105" y2="250"/>
  </g>
  <rect x="97" y="226" width="16" height="26" rx="3" fill="#ff7a3d"/>
  <!-- field of view -->
  <path d="M113 239 L470 92 L470 360 Z" fill="#ff7a3d" fill-opacity="0.08" stroke="#ff7a3d" stroke-opacity="0.5" stroke-dasharray="6 5"/>
  <!-- lifter: seen from the front here, so the camera on the left sees their side -->
  <g fill="#3b4150">
    <circle cx="430" cy="150" r="15"/>
    <rect x="410" y="168" width="40" height="80" rx="10"/>
    <rect x="412" y="244" width="15" height="102" rx="7"/>
    <rect x="433" y="244" width="15" height="102" rx="7"/>
    <rect x="394" y="172" width="12" height="62" rx="6"/>
    <rect x="454" y="172" width="12" height="62" rx="6"/>
  </g>
  <line x1="352" y1="172" x2="508" y2="172" stroke="#5b6475" stroke-width="5" stroke-linecap="round"/>
  <rect x="356" y="146" width="12" height="52" rx="3" fill="#5b6475"/>
  <rect x="492" y="146" width="12" height="52" rx="3" fill="#5b6475"/>
  <text x="430" y="372" font-size="12" text-anchor="middle" fill="#6b7280">lifter's side faces the camera</text>
  <!-- hip height -->
  <line x1="150" y1="239" x2="150" y2="350" stroke="#5b6475" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="158" y="296" font-size="13" fill="#3b4150">hip height</text>
  <text x="158" y="312" font-size="12" fill="#6b7280">≈ 0.9–1 m</text>
  <!-- distance -->
  <line x1="105" y1="392" x2="430" y2="392" stroke="#5b6475" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="268" y="414" font-size="14" text-anchor="middle" fill="#1a1d24" font-weight="600">3–4 m</text>
  <text x="300" y="78" font-size="13" fill="#3b4150">head, feet and plates stay in frame</text>
  <text x="300" y="94" font-size="12" fill="#6b7280">for the whole set, with margin</text>
  <text x="150" y="222" font-size="12" fill="#6b7280">camera level, not tilted</text>

  <!-- top view -->
  <text x="610" y="40" font-size="17" font-weight="700" fill="#1a1d24">Top view</text>
  <rect x="610" y="60" width="320" height="300" rx="10" fill="#ffffff" stroke="#e2e5eb"/>
  <!-- lifter from above -->
  <ellipse cx="840" cy="150" rx="24" ry="14" fill="#3b4150"/>
  <circle cx="840" cy="150" r="9" fill="#5b6475"/>
  <line x1="806" y1="150" x2="874" y2="150" stroke="#9aa1ad" stroke-width="5" stroke-linecap="round"/>
  <path d="M840 136 l0 -18" stroke="#3b4150" stroke-width="2" marker-end="url(#a)"/>
  <text x="852" y="120" font-size="11" fill="#6b7280">facing</text>
  <!-- camera for form -->
  <rect x="632" y="141" width="20" height="18" rx="3" fill="#ff7a3d"/>
  <path d="M652 150 L815 104 L815 196 Z" fill="#ff7a3d" fill-opacity="0.08" stroke="#ff7a3d" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <text x="634" y="182" font-size="12" fill="#3b4150">lift: side-on</text>
  <text x="634" y="197" font-size="11" fill="#6b7280">(add a front-on clip</text>
  <text x="634" y="211" font-size="11" fill="#6b7280">to see the knees)</text>
  <!-- progress photos -->
  <circle cx="770" cy="300" r="14" fill="#3b4150"/>
  <rect x="760" y="226" width="20" height="16" rx="3" fill="#22b5a4"/>
  <line x1="770" y1="244" x2="770" y2="282" stroke="#5b6475" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="782" y="262" font-size="12" fill="#3b4150">photos: 2–2.5 m,</text>
  <text x="782" y="277" font-size="12" fill="#3b4150">chest height</text>
  <text x="625" y="338" font-size="11" fill="#6b7280">tape marks where the phone and your feet go</text>
  <text x="625" y="352" font-size="11" fill="#6b7280">front, then turn 90°, then back to the camera</text>
</svg>
