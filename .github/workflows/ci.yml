name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  archive-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/archive/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgles2
      - run: pip install "./tools/archive[test]"
      - run: pytest -q tools/archive/tests
